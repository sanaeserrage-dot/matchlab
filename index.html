<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MatchLab ⚽</title>
<style>
  :root { --bg: #0b1320; --card: #111c2d; --border: #1e293b; --green: #10b981; --blue: #38bdf8; --text: #e2e8f0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 15px; }
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
  .brand h1 { margin: 0; font-size: 24px; color: #fff; }
  .brand small { color: var(--green); font-size: 11px; font-weight: bold; letter-spacing: 1px; }
  .status-badge { background: #064e3b; color: #34d399; padding: 5px 10px; border-radius: 20px; font-size: 11px; font-weight: bold; }
  .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  select, input[type="date"] { background: var(--card); color: #fff; border: 1px solid var(--border); padding: 12px; border-radius: 10px; font-size: 14px; width: 100%; box-sizing: border-box; }
  .btn { background: var(--green); color: #052e16; border: none; padding: 12px; border-radius: 10px; font-size: 15px; font-weight: bold; width: 100%; cursor: pointer; margin-bottom: 15px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 15px; text-align: center; }
  .stat-box { background: var(--card); border: 1px solid var(--border); padding: 10px; border-radius: 12px; }
  .stat-box b { font-size: 20px; display: block; color: #fff; }
  .stat-box span { font-size: 11px; color: #94a3b8; }
  .info-line { font-size: 12px; color: #94a3b8; margin-bottom: 15px; text-align: center; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
  .card-head { display: flex; justify-content: space-between; font-size: 12px; color: var(--blue); margin-bottom: 10px; }
  .teams { display: flex; justify-content: space-between; align-items: center; text-align: center; margin-bottom: 12px; }
  .team { width: 38%; }
  .team img { width: 32px; height: 32px; object-fit: contain; display: block; margin: 0 auto 5px; }
  .team b { font-size: 14px; display: block; }
  .team small { font-size: 11px; color: #64748b; }
  .score-box { background: #1e293b; padding: 6px 12px; border-radius: 8px; font-weight: bold; font-size: 15px; min-width: 60px; }
  .score-box small { display: block; font-size: 10px; color: var(--green); font-weight: normal; margin-top: 2px; }
  .probs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; background: var(--bg); padding: 8px; border-radius: 8px; font-size: 11px; text-align: center; margin-bottom: 8px; }
  .probs div b { display: block; color: var(--blue); font-size: 12px; }
  .tip { background: #064e3b; color: #a7f3d0; padding: 8px; border-radius: 8px; font-size: 12px; text-align: center; }
</style>
</head>
<body>

<div class="header">
  <div class="brand">
    <h1>MatchLab ⚽</h1>
    <small>SMART FOOTBALL ANALYSIS</small>
  </div>
  <div class="status-badge">iOS READY ✅</div>
</div>

<div class="controls">
  <select id="leagueSelect">
    <option value="all">جميع المسابقات المتاحة</option>
    <option value="eng.1">الدوري الإنجليزي الممتاز</option>
    <option value="esp.1">الدوري الإسباني</option>
    <option value="ita.1">الدوري الإيطالي</option>
    <option value="ger.1">الدوري الألماني</option>
    <option value="fra.1">الدوري الفرنسي</option>
    <option value="uefa.champions">دوري أبطال أوروبا</option>
    <option value="uefa.europa">الدوري الأوروبي</option>
    <option value="uefa.europa.conf">دوري المؤتمرات الأوروبي</option>
    <option value="mar.1">البطولة المغربية</option>
    <option value="ned.1">الدوري الهولندي</option>
    <option value="por.1">الدوري البرتغالي</option>
  </select>
  <input type="date" id="dateInput">
</div>

<button class="btn" onclick="loadMatches()">↻ تحديث المباريات</button>

<div class="stats">
  <div class="stat-box"><b id="stLeagues">0</b><span>مسابقة تم فحصها</span></div>
  <div class="stat-box"><b id="stLive">0</b><span>مباشرة</span></div>
  <div class="stat-box"><b id="stTotal">0</b><span>مباراة معروضة</span></div>
</div>

<div class="info-line" id="statusText">جاري الاتصال...</div>
<div id="matchesContainer"></div>

<script>
const LEAGUES = {
  "eng.1": "الدوري الإنجليزي",
  "esp.1": "الدوري الإسباني",
  "ita.1": "الدوري الإيطالي",
  "ger.1": "الدوري الألماني",
  "fra.1": "الدوري الفرنسي",
  "uefa.champions": "دوري أبطال أوروبا",
  "uefa.europa": "الدوري الأوروبي",
  "uefa.europa.conf": "دوري المؤتمرات",
  "mar.1": "البطولة المغربية",
  "ned.1": "الدوري الهولندي",
  "por.1": "الدوري البرتغالي"
};

document.getElementById('dateInput').valueAsDate = new Date();

function parseRecord(rec) {
  if (!rec) return [1, 1, 1];
  const p = rec.split('-').map(Number);
  return p.length === 3 && !isNaN(p[0]) ? p : [1, 1, 1];
}

function analyzeMatch(hRec, aRec, hName, aName) {
  const [hw, hd, hl] = parseRecord(hRec);
  const [aw, ad, al] = parseRecord(aRec);
  const hp = Math.max(hw + hd + hl, 1);
  const ap = Math.max(aw + ad + al, 1);

  const hStr = ((hw * 3 + hd) / (hp * 3)) * 1.15 + 0.15;
  const aStr = ((aw * 3 + ad) / (ap * 3)) + 0.15;
  const tot = hStr + aStr;

  const draw = 25;
  const hProb = Math.round((hStr / tot) * 75);
  const aProb = 75 - hProb;

  const atk = (hStr + aStr) / 2;
  const o25 = Math.min(Math.max(Math.round(atk * 95), 42), 84);
  const btts = Math.min(Math.max(Math.round(atk * 88), 38), 79);

  let tip = "مباراة متكافئة (1X أو BTTS)";
  if (hProb >= 53) tip = `فوز ${hName} (1)`;
  else if (aProb >= 53) tip = `فوز ${aName} (2)`;
  else if (o25 >= 62) tip = "أكثر من 2.5 أهداف (Over 2.5)";

  return { hProb, draw, aProb, o25, btts, tip };
}

// جلب البيانات مع نظام تخطي الحظر فـ الآيفون
async function fetchLeagueData(code, dateRange) {
  const targetUrl = `https://site.api.espn.com/apis/site/v2/sports/soccer/${code}/scoreboard?dates=${dateRange}`;
  const urlsToTry = [
    targetUrl,
    `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`,
    `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`
  ];

  for (const url of urlsToTry) {
    try {
      const res = await fetch(url);
      if (res.ok) return await res.json();
    } catch (e) {}
  }
  throw new Error("Blocked");
}

async function loadMatches() {
  const container = document.getElementById('matchesContainer');
  const statusText = document.getElementById('statusText');
  const selectedLeague = document.getElementById('leagueSelect').value;
  const dateVal = document.getElementById('dateInput').value;

  const start = dateVal ? new Date(dateVal) : new Date();
  const end = new Date(start);
  end.setDate(start.getDate() + 4);

  const fmt = d => d.toISOString().slice(0,10).replace(/-/g,'');
  const dateRange = `${fmt(start)}-${fmt(end)}`;

  const codes = selectedLeague === 'all' ? Object.keys(LEAGUES) : [selectedLeague];
  
  container.innerHTML = '';
  statusText.innerText = '⏳ جاري سحب وتحليل المباريات...';

  let checked = 0, liveCount = 0, totalMatches = 0, html = '';

  for (const code of codes) {
    try {
      const data = await fetchLeagueData(code, dateRange);
      checked++;
      document.getElementById('stLeagues').innerText = checked;

      const events = data.events || [];
      for (const ev of events) {
        const comp = ev.competitions[0];
        const h = comp.competitors.find(c => c.homeAway === 'home');
        const a = comp.competitors.find(c => c.homeAway === 'away');

        const hName = h.team.shortDisplayName;
        const aName = a.team.shortDisplayName;
        const hRec = h.records && h.records[0] ? h.records[0].summary : '0-0-0';
        const aRec = a.records && a.records[0] ? a.records[0].summary : '0-0-0';

        const state = ev.status.type.state;
        if (state === 'in') liveCount++;
        totalMatches++;

        const an = analyzeMatch(hRec, aRec, hName, aName);
        const matchDate = new Date(ev.date).toLocaleString('ar-MA', { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });

        html += `
        <div class="card">
          <div class="card-head">
            <span>🏆 ${LEAGUES[code]}</span>
            <span>🕒 ${matchDate}</span>
          </div>
          <div class="teams">
            <div class="team">
              <img src="${h.team.logo || ''}" onerror="this.style.display='none'">
              <b>${hName}</b>
              <small>${hRec}</small>
            </div>
            <div class="score-box">
              ${h.score || '0'} - ${a.score || '0'}
              <small>${ev.status.type.shortDetail}</small>
            </div>
            <div class="team">
              <img src="${a.team.logo || ''}" onerror="this.style.display='none'">
              <b>${aName}</b>
              <small>${aRec}</small>
            </div>
          </div>
          <div class="probs">
            <div>1<b>${an.hProb}%</b></div>
            <div>X<b>${an.draw}%</b></div>
            <div>2<b>${an.aProb}%</b></div>
            <div>+2.5<b>${an.o25}%</b></div>
            <div>BTTS<b>${an.btts}%</b></div>
          </div>
          <div class="tip">💡 التوقع الأفضل: <b>${an.tip}</b></div>
        </div>`;
      }
    } catch (e) {}
  }

  document.getElementById('stLive').innerText = liveCount;
  document.getElementById('stTotal').innerText = totalMatches;
  statusText.innerText = `✅ تم فحص ${checked} مسابقة بنجاح | عدد المباريات: ${totalMatches}`;
  container.innerHTML = html || '<p style="text-align:center;color:#94a3b8;">لا توجد مباريات مبرمجة في هذا التاريخ.</p>';
}

loadMatches();
</script>
</body>
</html>
